<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- card background -->
  <rect x="8" y="8" width="1184" height="584" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1.5"/>

  <!-- title -->
  <text x="60" y="64" font-size="13" font-weight="700" letter-spacing="3" fill="#64748B">SAME REQUEST, SAME MODEL</text>
  <text x="60" y="100" font-size="26" font-weight="700" fill="#E2E8F0">The only difference is the skill.</text>
  <text x="60" y="128" font-size="13.5" fill="#64748B">A real test: a six-part customer-health system requested for a 40-customer startup.</text>

  <!-- LEFT PANEL: without -->
  <rect x="60" y="152" width="520" height="366" rx="12" fill="#0F1526" stroke="#F87171" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="84" y="188" font-size="13" font-weight="700" letter-spacing="2" fill="#F87171">WITHOUT THE SKILL</text>
  <text x="84" y="214" font-size="13" font-style="italic" fill="#94A3B8">"Your plan is sound."</text>

  <text x="84" y="251" font-size="13.5" fill="#CBD5E1">Event tracking SDK</text>
  <rect x="424" y="237" width="132" height="20" rx="10" fill="none" stroke="#F87171" stroke-opacity="0.5"/>
  <text x="490" y="251" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">KEPT + OPTIMIZED</text>

  <text x="84" y="284" font-size="13.5" fill="#CBD5E1">Warehouse sync</text>
  <rect x="424" y="270" width="132" height="20" rx="10" fill="none" stroke="#F87171" stroke-opacity="0.5"/>
  <text x="490" y="284" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">KEPT + OPTIMIZED</text>

  <text x="84" y="317" font-size="13.5" fill="#CBD5E1">12-signal health score</text>
  <rect x="424" y="303" width="132" height="20" rx="10" fill="none" stroke="#F87171" stroke-opacity="0.5"/>
  <text x="490" y="317" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">KEPT + OPTIMIZED</text>

  <text x="84" y="350" font-size="13.5" fill="#CBD5E1">React dashboard</text>
  <rect x="424" y="336" width="132" height="20" rx="10" fill="none" stroke="#F87171" stroke-opacity="0.5"/>
  <text x="490" y="350" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">KEPT + OPTIMIZED</text>

  <text x="84" y="383" font-size="13.5" fill="#CBD5E1">Slack anomaly alerts</text>
  <rect x="424" y="369" width="132" height="20" rx="10" fill="none" stroke="#F87171" stroke-opacity="0.5"/>
  <text x="490" y="383" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">KEPT + OPTIMIZED</text>

  <text x="84" y="416" font-size="13.5" fill="#CBD5E1">Nightly recompute cron</text>
  <rect x="424" y="402" width="132" height="20" rx="10" fill="none" stroke="#F87171" stroke-opacity="0.5"/>
  <text x="490" y="416" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">KEPT + OPTIMIZED</text>

  <line x1="84" y1="448" x2="556" y2="448" stroke="#1E293B" stroke-width="1.5"/>
  <text x="84" y="480" font-size="14" font-weight="700" fill="#E2E8F0">Result: six systems to build, debug,</text>
  <text x="84" y="500" font-size="14" font-weight="700" fill="#E2E8F0">and maintain forever</text>

  <!-- RIGHT PANEL: with -->
  <rect x="620" y="152" width="520" height="366" rx="12" fill="#0F1526" stroke="#4ADE80" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="644" y="188" font-size="13" font-weight="700" letter-spacing="2" fill="#4ADE80">WITH THE SKILL</text>
  <text x="644" y="214" font-size="13" font-style="italic" fill="#94A3B8">"What breaks if this does not exist?"</text>

  <text x="644" y="251" font-size="13.5" fill="#64748B" text-decoration="line-through">Event tracking SDK</text>
  <rect x="1040" y="237" width="76" height="20" rx="10" fill="none" stroke="#64748B" stroke-opacity="0.6"/>
  <text x="1078" y="251" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">DELETED</text>

  <text x="644" y="284" font-size="13.5" fill="#64748B" text-decoration="line-through">Warehouse sync</text>
  <rect x="1040" y="270" width="76" height="20" rx="10" fill="none" stroke="#64748B" stroke-opacity="0.6"/>
  <text x="1078" y="284" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">DELETED</text>

  <text x="644" y="317" font-size="13.5" fill="#64748B" text-decoration="line-through">12-signal health score</text>
  <rect x="1040" y="303" width="76" height="20" rx="10" fill="none" stroke="#64748B" stroke-opacity="0.6"/>
  <text x="1078" y="317" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">DELETED</text>

  <text x="644" y="350" font-size="13.5" fill="#64748B" text-decoration="line-through">React dashboard</text>
  <rect x="1040" y="336" width="76" height="20" rx="10" fill="none" stroke="#64748B" stroke-opacity="0.6"/>
  <text x="1078" y="350" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">DELETED</text>

  <text x="644" y="383" font-size="13.5" fill="#64748B" text-decoration="line-through">Slack anomaly alerts</text>
  <rect x="1040" y="369" width="76" height="20" rx="10" fill="none" stroke="#64748B" stroke-opacity="0.6"/>
  <text x="1078" y="383" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">DELETED</text>

  <text x="644" y="416" font-size="13.5" fill="#64748B" text-decoration="line-through">Nightly recompute cron</text>
  <rect x="1040" y="402" width="76" height="20" rx="10" fill="none" stroke="#64748B" stroke-opacity="0.6"/>
  <text x="1078" y="416" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">DELETED</text>

  <line x1="644" y1="448" x2="1116" y2="448" stroke="#1E293B" stroke-width="1.5"/>
  <text x="644" y="480" font-size="14" font-weight="700" fill="#4ADE80">Result: one SQL query, added to the</text>
  <text x="644" y="500" font-size="14" font-weight="700" fill="#4ADE80">Monday spreadsheet the team already uses</text>

  <!-- footer -->
  <text x="600" y="560" font-size="13.5" fill="#64748B" text-anchor="middle">It also told the founder to backtest the signals against past churn before building anything. That advice was free.</text>
</svg>
