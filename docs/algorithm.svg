<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1184" height="384" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1.5"/>

  <text x="60" y="64" font-size="15" font-weight="700" letter-spacing="3" fill="#64748B">THE ALGORITHM</text>
  <text x="60" y="112" font-size="34" font-weight="700" fill="#E2E8F0">Five steps. The order is the point.</text>

  <!-- step 1 -->
  <rect x="50" y="150" width="196" height="130" rx="12" fill="#111A2E" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="2"/>
  <text x="148" y="207" font-size="36" font-weight="700" fill="#F59E0B" text-anchor="middle">1</text>
  <text x="148" y="248" font-size="22" font-weight="700" fill="#E2E8F0" text-anchor="middle">QUESTION</text>

  <!-- step 2 -->
  <rect x="276" y="150" width="196" height="130" rx="12" fill="#111A2E" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="2"/>
  <text x="374" y="207" font-size="36" font-weight="700" fill="#F59E0B" text-anchor="middle">2</text>
  <text x="374" y="248" font-size="22" font-weight="700" fill="#E2E8F0" text-anchor="middle">DELETE</text>

  <!-- step 3 -->
  <rect x="502" y="150" width="196" height="130" rx="12" fill="#111A2E" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2"/>
  <text x="600" y="207" font-size="36" font-weight="700" fill="#38BDF8" text-anchor="middle">3</text>
  <text x="600" y="248" font-size="22" font-weight="700" fill="#E2E8F0" text-anchor="middle">SIMPLIFY</text>

  <!-- step 4 -->
  <rect x="728" y="150" width="196" height="130" rx="12" fill="#111A2E" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2"/>
  <text x="826" y="207" font-size="36" font-weight="700" fill="#38BDF8" text-anchor="middle">4</text>
  <text x="826" y="248" font-size="22" font-weight="700" fill="#E2E8F0" text-anchor="middle">ACCELERATE</text>

  <!-- step 5 -->
  <rect x="954" y="150" width="196" height="130" rx="12" fill="#111A2E" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2"/>
  <text x="1052" y="207" font-size="36" font-weight="700" fill="#38BDF8" text-anchor="middle">5</text>
  <text x="1052" y="248" font-size="22" font-weight="700" fill="#E2E8F0" text-anchor="middle">AUTOMATE</text>

  <!-- arrows -->
  <line x1="250" y1="215" x2="270" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="215" x2="496" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="702" y1="215" x2="722" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="928" y1="215" x2="948" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- phase brackets -->
  <line x1="50" y1="316" x2="472" y2="316" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="2.5"/>
  <text x="261" y="352" font-size="20" font-weight="700" letter-spacing="2" fill="#F59E0B" text-anchor="middle">SUBTRACT FIRST</text>
  <line x1="502" y1="316" x2="1150" y2="316" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="2.5"/>
  <text x="826" y="352" font-size="20" font-weight="700" letter-spacing="2" fill="#38BDF8" text-anchor="middle">THEN IMPROVE</text>
</svg>
