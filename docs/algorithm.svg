<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- card background -->
  <rect x="8" y="8" width="1184" height="454" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1.5"/>

  <!-- title -->
  <text x="60" y="64" font-size="13" font-weight="700" letter-spacing="3" fill="#64748B">THE ALGORITHM</text>
  <text x="60" y="100" font-size="26" font-weight="700" fill="#E2E8F0">Five steps. The order is the point.</text>

  <!-- step 1 -->
  <rect x="60" y="130" width="184" height="170" rx="12" fill="#111A2E" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="80" y="176" font-size="26" font-weight="700" fill="#F59E0B">1</text>
  <text x="80" y="210" font-size="17" font-weight="700" fill="#E2E8F0">QUESTION</text>
  <text x="80" y="240" font-size="12.5" fill="#94A3B8">Every requirement gets</text>
  <text x="80" y="258" font-size="12.5" fill="#94A3B8">an owner and evidence</text>

  <!-- step 2 -->
  <rect x="284" y="130" width="184" height="170" rx="12" fill="#111A2E" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="304" y="176" font-size="26" font-weight="700" fill="#F59E0B">2</text>
  <text x="304" y="210" font-size="17" font-weight="700" fill="#E2E8F0">DELETE</text>
  <text x="304" y="240" font-size="12.5" fill="#94A3B8">If nothing comes back,</text>
  <text x="304" y="258" font-size="12.5" fill="#94A3B8">you didn't cut enough</text>

  <!-- step 3 -->
  <rect x="508" y="130" width="184" height="170" rx="12" fill="#111A2E" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="528" y="176" font-size="26" font-weight="700" fill="#38BDF8">3</text>
  <text x="528" y="210" font-size="17" font-weight="700" fill="#E2E8F0">SIMPLIFY</text>
  <text x="528" y="240" font-size="12.5" fill="#94A3B8">Improve only what</text>
  <text x="528" y="258" font-size="12.5" fill="#94A3B8">survived deletion</text>

  <!-- step 4 -->
  <rect x="732" y="130" width="184" height="170" rx="12" fill="#111A2E" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="752" y="176" font-size="26" font-weight="700" fill="#38BDF8">4</text>
  <text x="752" y="210" font-size="17" font-weight="700" fill="#E2E8F0">ACCELERATE</text>
  <text x="752" y="240" font-size="12.5" fill="#94A3B8">Speed up only what</text>
  <text x="752" y="258" font-size="12.5" fill="#94A3B8">deserves to exist</text>

  <!-- step 5 -->
  <rect x="956" y="130" width="184" height="170" rx="12" fill="#111A2E" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="976" y="176" font-size="26" font-weight="700" fill="#38BDF8">5</text>
  <text x="976" y="210" font-size="17" font-weight="700" fill="#E2E8F0">AUTOMATE</text>
  <text x="976" y="240" font-size="12.5" fill="#94A3B8">Last, always. It locks</text>
  <text x="976" y="258" font-size="12.5" fill="#94A3B8">the process in</text>

  <!-- arrows between steps -->
  <line x1="248" y1="215" x2="278" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="215" x2="502" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="696" y1="215" x2="726" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="215" x2="950" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- phase brackets -->
  <line x1="60" y1="332" x2="468" y2="332" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="2"/>
  <text x="264" y="358" font-size="13" font-weight="700" letter-spacing="2" fill="#F59E0B" text-anchor="middle">SUBTRACT FIRST</text>
  <line x1="508" y1="332" x2="1140" y2="332" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="824" y="358" font-size="13" font-weight="700" letter-spacing="2" fill="#38BDF8" text-anchor="middle">THEN IMPROVE</text>

  <!-- bottom annotations -->
  <circle cx="66" cy="414" r="4" fill="#F87171"/>
  <text x="80" y="419" font-size="13.5" fill="#94A3B8">Most projects start at step 5 and work backward</text>
  <circle cx="426" cy="414" r="4" fill="#4ADE80"/>
  <text x="440" y="419" font-size="13.5" fill="#94A3B8">The algorithm makes every step earn its place, starting at 1</text>
</svg>
